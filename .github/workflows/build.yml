name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "feed/**"
      - "README.md"
      - "*.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the launcher
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk revive-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: revive-tv
          path: revive-tv.apk

      - name: Publish to the download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Revive TV (latest build)
          body: "Install on the TV with the Downloader app using the link to revive-tv.apk below."
          files: revive-tv.apk
          make_latest: true
